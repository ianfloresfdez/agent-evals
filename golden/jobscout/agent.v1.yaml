suite: jobscout-agent
version: 1
description: >
  A tool-calling LLM gets the jobscout MCP tools and a user request. We check which tools it picks and with
  which arguments, whether the answer is grounded in the tool output, tokens and latency. Job-board traffic is
  replayed from a cassette (misses are recorded), so differences between runs come from the model.
target:
  type: jobscout-agent
  path: ../../../jobscout-mcp           # or JOBSCOUT_PATH
  model: ollama:gemma4:12b              # or AGENT_EVALS_AGENT_MODEL, e.g. openai:gpt-4.1-mini
  think: false
  num_ctx: 16384
  max_turns: 6
  tool_output_chars: 6000
  cassette: ../../cassettes/jobscout-agent-2026-10.json.gz
  cassette_mode: auto
budgets:
  latency_ms: 120000
  total_tokens: 40000
regression:
  max_pass_rate_drop: 0.0
  max_judge_mean_drop: 0.5
  max_tokens_mean_increase_pct: 25
rubric: |
  - Answers the user's actual question, using only facts present in the tool evidence.
  - Mentions concrete items from the evidence (skills, companies, posting ids or counts) instead of generic advice.
  - Says so plainly when the tools found nothing, without inventing postings.
  - Uses the user's language.

cases:
  - id: market-skills-and-pay
    tags: [market]
    input: What do AI engineer roles in Europe ask for right now, and what do they pay?
    expect:
      tools:
        required:
          - { name: market_snapshot, args: { query: { regex: "(?i)(ai|engineer)" }, location: { regex: "(?i)europe" } } }
        allowed: [search_jobs]
        forbidden: [rank_jobs_for_me]
        max_calls: 3
      judge: { min_score: 3 }

  - id: recent-remote-python
    tags: [search, arguments]
    input: Search remote Python jobs posted in the last week.
    expect:
      tools:
        required:
          - { name: search_jobs, args: { query: { contains: python }, max_age_days: { lte: 7 }, remote_only: true } }
        max_calls: 2
      output:
        - regex: '\[[a-z]+:[^\]]+\]'
      judge: { min_score: 3 }

  - id: rank-against-my-skills
    tags: [ranking, arguments]
    input: >
      Rank backend engineer jobs against my skills and tell me what I'm missing most often.
      My skills: Python, FastAPI, Docker, PostgreSQL, AWS.
    expect:
      tools:
        required:
          - { name: rank_jobs_for_me, args: { skills: { contains_all: [Python, FastAPI, Docker, PostgreSQL, AWS] } } }
        allowed: [search_jobs, get_job]
        max_calls: 3
      judge: { min_score: 3 }

  - id: search-then-open-first
    tags: [multi-step]
    input: Find recent Python jobs and open the first one with its full description.
    expect:
      tools:
        required:
          - { name: search_jobs, args: { query: { contains: python } } }
          - { name: get_job, args: { id: { regex: "^[a-z]+:.+" } } }
        ordered: true
        max_calls: 4
      judge: { min_score: 3 }

  - id: which-sources
    tags: [discovery]
    input: Which job boards can you search, and which of them need an API key?
    expect:
      tools:
        required: [{ name: list_sources }]
        forbidden: [search_jobs, market_snapshot, rank_jobs_for_me]
      output:
        - contains: Adzuna
      judge: { min_score: 4 }

  - id: spanish-request
    tags: [market, language]
    input: ¿Qué tecnologías piden ahora las ofertas de ingeniero de software en remoto? Resúmelo en español.
    expect:
      tools:
        required:
          - { name: market_snapshot }
        allowed: [search_jobs]
        max_calls: 3
      output:
        - regex: "(?i)\\b(las|los|ofertas|piden)\\b"
      judge: { min_score: 3 }

  - id: nothing-found-no-invention
    tags: [grounding]
    input: Find me jobs for an underwater basket weaving quantum engineer.
    expect:
      tools:
        required: [{ name: search_jobs }]
        allowed: [market_snapshot]
        max_calls: 3
      output:
        - not_regex: '\[[a-z]+:\d+\]'
      judge: { min_score: 3 }

  - id: no-tool-needed
    tags: [restraint]
    input: In one sentence, what is the difference between a remote and a hybrid job?
    expect:
      tools:
        max_calls: 0
    rubric: |
      A correct one-sentence definition: remote means working away from the office all or nearly all the time,
      hybrid means splitting time between home and the office. No job listings needed.
