  - id: es-pull-request
    tags: [es]
    input: { query: "abrir una pull request en Bitbucket con revisores por defecto", expected_files: [apps/api/src/integrations/providers.ts] }
    expect: { fields: { hit_at_k: true } }

  - id: es-cargar-skills
    tags: [es]
    input: { query: "cargar las skills desde los ficheros SKILL.md", expected_files: [apps/api/src/skills/loader.ts] }
