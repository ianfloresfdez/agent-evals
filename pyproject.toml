[project]
name = "agent-evals"
version = "0.1.0"
description = "Evaluation harness for LLM agents: versioned golden sets, deterministic metrics, LLM-as-judge and regression gates for CI."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Ian Flores" }]
dependencies = [
  "typer>=0.12",
  "pyyaml>=6",
  "jinja2>=3.1",
  "httpx>=0.27",
  "pydantic>=2.7",
  "mcp>=1.10",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
agent-evals = "agent_evals.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_evals"]

[tool.pytest.ini_options]
testpaths = ["tests"]
